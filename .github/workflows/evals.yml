name: Evals

# On demand only. Evals spend model tokens, so they run at decision points (a model,
# prompt or chat-path change), never on every push (MusicNerdWeb docs/evals.md). Pick
# the branch whose code you want measured.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run: a file under evals/, without .eval.ts"
        type: choice
        options:
          - chat
          - chat-single
          - pdf106-paired
          - pdf106-pete-smoke
          - pdf106-four-paired
        default: chat
      candidate_sha:
        description: "Exact approved commit for chat-single (unused by other suites)"
        type: string
      manifest_sha256:
        description: "Exact approved single-case manifest hash (unused by other suites)"
        type: string

# One run at a time: the chat suite's timings would measure each other, and every
# question writes allowance rows on the staging database.
concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  eval:
    if: inputs.suite == 'chat' || inputs.suite == 'chat-single'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # The STAGING database: the suite's artist ids are staging ids.
      SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
      # The chat keys the hourly question allowance with it and fails closed without it.
      MUSICNERD_RESEARCH_API_KEY: ${{ secrets.MUSICNERD_RESEARCH_API_KEY }}
      # The slow path's web search and social research.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      # A signed-out question counts against the allowance per IP, read from x-real-ip
      # only on Vercel; the task sends a documentation address (lib/evals/chatStreamTurn.ts).
      VERCEL: "1"

    steps:
      - name: Refuse single-case reruns or unpinned execution
        if: inputs.suite == 'chat-single'
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "${#MANIFEST_SHA}" = "64"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        if: inputs.suite == 'chat'
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-node@v4
        if: inputs.suite == 'chat-single'
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Run suite
        if: inputs.suite == 'chat'
        run: pnpm eval "evals/${{ inputs.suite }}.eval.ts" --no-progress-bars --terminate-on-failure
      - name: Run one guarded ordinary-chat case
        if: inputs.suite == 'chat-single'
        env:
          CHAT_SINGLE_MANIFEST: evals/chat-single-manifest.json
          CHAT_SINGLE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          CHAT_SINGLE_EXPECTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          # Public origin derived only within this job; never print the connection.
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          try {
            const u = new URL(process.env.SUPABASE_DB_CONNECTION);
            const direct = /^db\.([a-z0-9]{20})\.supabase\.co$/.exec(u.hostname);
            const pooled = /\.([a-z0-9]{20})$/.exec(decodeURIComponent(u.username));
            const ref = direct?.[1] ?? pooled?.[1];
            if (!ref) throw new Error('Unsupported staging connection format');
            appendFileSync(process.env.GITHUB_ENV, `SUPABASE_URL=https://${ref}.supabase.co\n`);
          } catch {
            console.error('Staging origin derivation failed; no configuration values emitted.');
            process.exit(1);
          }
          JS
          # GITHUB_ENV applies to subsequent steps, so run in the next step.
      - name: Execute single case with private evidence only
        if: inputs.suite == 'chat-single'
        env:
          CHAT_SINGLE_MANIFEST: evals/chat-single-manifest.json
          CHAT_SINGLE_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          CHAT_SINGLE_EXPECTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          umask 077
          set +e
          pnpm eval evals/chat.eval.ts --no-progress-bars --terminate-on-failure > "$RUNNER_TEMP/chat-single-console.log" 2>&1
          status=$?
          set -e
          echo "Single-case executor finished. Inspect the private Braintrust experiment; workflow success is not answer acceptance."
          exit "$status"

  pdf106-paired:
    if: inputs.suite == 'pdf106-paired' || inputs.suite == 'pdf106-pete-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
      MUSICNERD_RESEARCH_API_KEY: ${{ secrets.MUSICNERD_RESEARCH_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      VERCEL: "1"
      PDF106_MODE: ${{ inputs.suite == 'pdf106-pete-smoke' && 'pete-smoke' || 'original' }}
      PDF106_OUTPUT: ${{ github.workspace }}/pdf106-results
    steps:
      - name: Refuse automatic reruns of a spending job
        run: test "${{ github.run_attempt }}" = "1"
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ inputs.suite == 'pdf106-pete-smoke' && 'f9344be7908051180c3a5050d8118435e20e895e' || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: adapter
      - uses: actions/checkout@v4
        with:
          ref: e4054a4783ab3cf7dfdadf91d7285a54adf3c734
          path: baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and identical observer
        run: |
          pnpm --dir baseline install --frozen-lockfile
          pnpm --dir candidate install --frozen-lockfile
          cp -R adapter/benchmarks/pdf106/. candidate/benchmarks/pdf106/
          mkdir -p baseline/benchmarks
          cp -R candidate/benchmarks/pdf106 baseline/benchmarks/pdf106
      - name: Baseline bounded selected questions
        working-directory: baseline
        env:
          PDF106_COHORT: baseline
        run: |
          node benchmarks/pdf106/build.mjs
          node .next/pdf106-run.mjs
      - name: Candidate bounded selected questions
        working-directory: candidate
        env:
          PDF106_COHORT: candidate
        run: |
          node benchmarks/pdf106/build.mjs
          node .next/pdf106-run.mjs
      - name: Retain sanitized evidence even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf106-paired-${{ github.run_id }}
          path: ${{ github.workspace }}/pdf106-results
          if-no-files-found: warn
          retention-days: 7

  pdf106-four-paired:
    if: inputs.suite == 'pdf106-four-paired'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Refuse spending job reruns
        run: test "${{ github.run_attempt }}" = "1"
      - uses: actions/checkout@v4
        with:
          path: adapter
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 4fa7c2f02030a17256452fde4508548b2f793e43
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 277e8ebadb9c55c10a11f2d774afafa9a8c276d8
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned applications and identical adapter
        run: |
          pnpm --dir candidate install --frozen-lockfile
          pnpm --dir baseline install --frozen-lockfile
          cp -R adapter/benchmarks/pdf106v2/. candidate/benchmarks/pdf106v2/
          cp -R adapter/benchmarks/pdf106v2/. baseline/benchmarks/pdf106v2/
          mkdir -p pdf-chat-eval/acceptance-v2 pdf106-four-results
      - name: Read and verify the two existing original PDFs
        working-directory: candidate
        env:
          SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
        run: node benchmarks/pdf106v2/download-originals.mjs ../evidence
      - name: Verify offline boundaries and serialization on both pins
        run: |
          for checkout in baseline candidate; do
            (cd "$checkout" && pnpm exec vitest run benchmarks/pdf106v2/__tests__ && node benchmarks/pdf106v2/build.mjs benchmarks/pdf106v2/offline.ts && node .next/pdf106v2-run.mjs && node benchmarks/pdf106v2/build.mjs)
          done
      - name: Run exactly four approved answers in fixed interleaved order
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          (cd baseline && node .next/pdf106v2-run.mjs --approved-four-paired --cohort baseline --case pdf-alias --output ../pdf106-four-results --fixtures ../evidence)
          (cd candidate && node .next/pdf106v2-run.mjs --approved-four-paired --cohort candidate --case pdf-alias --output ../pdf106-four-results --fixtures ../evidence)
          (cd candidate && node .next/pdf106v2-run.mjs --approved-four-paired --cohort candidate --case pdf-qualified-preservation --output ../pdf106-four-results --fixtures ../evidence)
          (cd baseline && node .next/pdf106v2-run.mjs --approved-four-paired --cohort baseline --case pdf-qualified-preservation --output ../pdf106-four-results --fixtures ../evidence)
      - name: Retain sanitized evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf106-four-${{ github.run_id }}
          path: |
            pdf106-four-results
            pdf-chat-eval/acceptance-v2/harness-offline.json
          if-no-files-found: warn
          retention-days: 7
