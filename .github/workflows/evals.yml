name: Evals

# On demand only. Evals spend model tokens, so they run at decision points (a model,
# prompt or chat-path change), never on every push (MusicNerdWeb docs/evals.md). Pick
# the branch whose code you want measured.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run: a file under evals/, without .eval.ts"
        type: choice
        options:
          - chat
          - pdf106-paired
          - pdf106-pete-smoke
          - pdf106-three-originals
        default: chat

# One run at a time: the chat suite's timings would measure each other, and every
# question writes allowance rows on the staging database.
concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  eval:
    if: inputs.suite == 'chat'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # The STAGING database: the suite's artist ids are staging ids.
      SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
      # The chat keys the hourly question allowance with it and fails closed without it.
      MUSICNERD_RESEARCH_API_KEY: ${{ secrets.MUSICNERD_RESEARCH_API_KEY }}
      # The slow path's web search and social research.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      # A signed-out question counts against the allowance per IP, read from x-real-ip
      # only on Vercel; the task sends a documentation address (lib/evals/chatStreamTurn.ts).
      VERCEL: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run suite
        run: pnpm eval "evals/${{ inputs.suite }}.eval.ts" --no-progress-bars --terminate-on-failure

  pdf106-paired:
    if: inputs.suite == 'pdf106-paired' || inputs.suite == 'pdf106-pete-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
      MUSICNERD_RESEARCH_API_KEY: ${{ secrets.MUSICNERD_RESEARCH_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      VERCEL: "1"
      PDF106_MODE: ${{ inputs.suite == 'pdf106-pete-smoke' && 'pete-smoke' || 'original' }}
      PDF106_OUTPUT: ${{ github.workspace }}/pdf106-results
    steps:
      - name: Refuse automatic reruns of a spending job
        run: test "${{ github.run_attempt }}" = "1"
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ inputs.suite == 'pdf106-pete-smoke' && 'f9344be7908051180c3a5050d8118435e20e895e' || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: adapter
      - uses: actions/checkout@v4
        with:
          ref: e4054a4783ab3cf7dfdadf91d7285a54adf3c734
          path: baseline
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies and identical observer
        run: |
          pnpm --dir baseline install --frozen-lockfile
          pnpm --dir candidate install --frozen-lockfile
          cp -R adapter/benchmarks/pdf106/. candidate/benchmarks/pdf106/
          mkdir -p baseline/benchmarks
          cp -R candidate/benchmarks/pdf106 baseline/benchmarks/pdf106
      - name: Baseline bounded selected questions
        working-directory: baseline
        env:
          PDF106_COHORT: baseline
        run: |
          node benchmarks/pdf106/build.mjs
          node .next/pdf106-run.mjs
      - name: Candidate bounded selected questions
        working-directory: candidate
        env:
          PDF106_COHORT: candidate
        run: |
          node benchmarks/pdf106/build.mjs
          node .next/pdf106-run.mjs
      - name: Retain sanitized evidence even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf106-paired-${{ github.run_id }}
          path: ${{ github.workspace }}/pdf106-results
          if-no-files-found: warn
          retention-days: 7

  pdf106-three-originals:
    if: inputs.suite == 'pdf106-three-originals'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Refuse spending job reruns
        run: test "${{ github.run_attempt }}" = "1"
      - uses: actions/checkout@v4
        with:
          path: adapter
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 3b6d96283c0123573881d22807feac6e0aa39061
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned candidate and isolated adapter
        run: |
          pnpm --dir candidate install --frozen-lockfile
          cp -R adapter/benchmarks/pdf106v2 candidate/benchmarks/pdf106v2
          mkdir -p pdf-chat-eval/acceptance-v2 pdf106-three-results
      - name: Read and verify the two existing original PDFs
        working-directory: candidate
        env:
          SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
        run: node benchmarks/pdf106v2/download-originals.mjs ../evidence
      - name: Verify offline boundaries and serialization
        working-directory: candidate
        run: |
          pnpm exec vitest run benchmarks/pdf106v2/__tests__
          node benchmarks/pdf106v2/build.mjs benchmarks/pdf106v2/offline.ts
          node .next/pdf106v2-run.mjs
      - name: Run exactly three approved candidate questions
        working-directory: candidate
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          node benchmarks/pdf106v2/build.mjs
          node .next/pdf106v2-run.mjs --approved-live-v2 --output ../pdf106-three-results --fixtures ../evidence
      - name: Retain sanitized evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf106-three-${{ github.run_id }}
          path: |
            pdf106-three-results
            pdf-chat-eval/acceptance-v2/harness-offline.json
          if-no-files-found: warn
          retention-days: 7
