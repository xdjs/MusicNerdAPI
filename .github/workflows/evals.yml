name: Evals

# On demand only. Evals spend model tokens, so they run at decision points (a model,
# prompt or chat-path change), never on every push (MusicNerdWeb docs/evals.md). Pick
# the branch whose code you want measured.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run: a file under evals/, without .eval.ts"
        type: choice
        options:
          - chat
          - vision-page
          - retrieval
          - units-backfill
          - source-text-backfill
        default: chat
      case_trials:
        description: "chat only: ask each case (each selected case, with cases) this many times, 1 to 5; empty asks each once"
        type: string
        default: ""
      effort:
        description: "chat only: model reasoning effort low or medium; empty is low"
        type: string
        default: ""
      label:
        description: "retrieval only: print each hit's source id, page locator, title and public URL (never text) so the cases can be labelled"
        type: boolean
        default: false
      cases:
        description: "chat only: comma-separated case keys to run; empty runs all"
        type: string
        default: ""
      units_max_per_document:
        description: "retrieval/chat: the most units of one document among the hits (UNITS_MAX_PER_DOCUMENT, 1-8); empty keeps 3"
        type: string
        default: ""
      units_text_mode:
        description: "retrieval/chat: full-text matching (UNITS_TEXT_MODE): and (every word), or (any term) or idf (any term, ranked by rarity); the default is idf"
        type: string
        default: ""
      units_candidates:
        description: "retrieval/chat: candidates per text and vector list (UNITS_CANDIDATES, 10-60); empty keeps 20"
        type: string
        default: ""

# One run at a time: the chat suite's timings would measure each other, and every
# question writes allowance rows on the staging database.
concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  eval:
    if: inputs.suite == 'chat' || inputs.suite == 'vision-page' || inputs.suite == 'retrieval' || inputs.suite == 'units-backfill' || inputs.suite == 'source-text-backfill'
    runs-on: ubuntu-latest
    # A run takes about eight minutes; the suite waits up to an hour when the staging
    # question allowance (30 per rolling hour) is still used by an earlier run.
    timeout-minutes: 80

    env:
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      # The STAGING database: the suite's artist ids are staging ids.
      SUPABASE_DB_CONNECTION: ${{ secrets.SUPABASE_DB_CONNECTION }}
      # The chat keys the hourly question allowance with it and fails closed without it.
      MUSICNERD_RESEARCH_API_KEY: ${{ secrets.MUSICNERD_RESEARCH_API_KEY }}
      # The slow path's web search and social research.
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      # A signed-out question counts against the allowance per IP, read from x-real-ip
      # only on Vercel; the task sends a documentation address (lib/evals/chatStreamTurn.ts).
      VERCEL: "1"
      # The chat suite's trials per case (each selected case, with cases), 1 to 5 (lib/evals/selectChatCases.ts); empty asks each once.
      CHAT_CASE_TRIALS: ${{ inputs.case_trials }}
      # The retrieval suite's labelling mode (evals/retrieval.eval.ts).
      RETRIEVAL_LABEL: ${{ inputs.label && '1' || '0' }}
      # The chat's reasoning effort (lib/chat/getChatEffort.ts).
      CHAT_EFFORT: ${{ inputs.effort }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Stored documents are read from the staging project's public storage origin, so the
      # suites need SUPABASE_URL; derive it from the database connection rather than adding a secret.
      - name: Bind the staging storage origin for this job only
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          try {
            const u = new URL(process.env.SUPABASE_DB_CONNECTION);
            const direct = /^db\.([a-z0-9]{20})\.supabase\.co$/.exec(u.hostname);
            const pooled = /^[a-z0-9-]+\.pooler\.supabase\.com$/.test(u.hostname) ? /\.([a-z0-9]{20})$/.exec(decodeURIComponent(u.username)) : null;
            const ref = direct?.[1] ?? pooled?.[1];
            if (!['postgres:', 'postgresql:'].includes(u.protocol) || !ref) throw new Error('Unsupported staging connection format');
            appendFileSync(process.env.GITHUB_ENV, `SUPABASE_URL=https://${ref}.supabase.co\n`);
          } catch {
            console.error('CHAT_ORIGIN_FAILED: no configuration values emitted');
            process.exit(1);
          }
          JS
      - name: Run suite
        # Search tuning overrides for comparing ranking variants (lib/units/getSearchTuning.ts);
        # empty or invalid values keep the defaults.
        env:
          UNITS_MAX_PER_DOCUMENT: ${{ inputs.units_max_per_document }}
          UNITS_TEXT_MODE: ${{ inputs.units_text_mode }}
          UNITS_CANDIDATES: ${{ inputs.units_candidates }}
          # The chat suite's case selection (lib/evals/selectChatCases.ts); empty runs all.
          CHAT_CASES: ${{ inputs.cases }}
        run: pnpm eval "evals/${{ inputs.suite }}.eval.ts" --no-progress-bars --terminate-on-failure
